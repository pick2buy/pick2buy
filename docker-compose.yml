version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pick2buy_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pick2buy}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pick2buy_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pick2buy?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_pick2buy_jwt_access_key_change_in_production_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_pick2buy_jwt_refresh_key_change_in_production_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_pick2buy_placeholder_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_pick2buy_placeholder_secret}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-pick2buy.in@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-password}
      EMAIL_FROM: ${EMAIL_FROM:-pick2buy.in@gmail.com}

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: pick2buy_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
